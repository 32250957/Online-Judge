name: OJ regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oj
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: oj_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oj -d oj_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OJ_TEST_DATABASE_URL: postgresql+psycopg2://oj:test-password@localhost:5432/oj_test
      OJ_TEST_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest httpx
      - name: Prepare judge images
        run: |
          docker pull python:3.11-slim
          docker build -f Dockerfile.gcc -t oj-gcc:13 .
          docker pull eclipse-temurin:17
      - run: python -m pytest -q
      - name: Check that judge containers were removed
        if: always()
        run: test -z "$(docker ps -aq --filter name=oj-run-)"
